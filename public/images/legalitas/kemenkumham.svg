<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kmkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#D48806"/>
    </linearGradient>
    <linearGradient id="kmkNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A1E3F"/>
      <stop offset="100%" stop-color="#040D1C"/>
    </linearGradient>
    <filter id="kmkGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="200" cy="200" r="190" fill="url(#kmkNavy)" stroke="url(#kmkGold)" stroke-width="7" filter="url(#kmkGlow)"/>
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#kmkGold)" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="200" cy="200" r="140" fill="#0C244C" stroke="url(#kmkGold)" stroke-width="4"/>

  <!-- Curved Text Top: KEMENTERIAN HUKUM DAN HAM RI -->
  <path id="textArcTop" d="M 58 200 A 142 142 0 0 1 342 200" fill="none"/>
  <text fill="#FFE082" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14.5" font-weight="800" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      KEMENTERIAN HUKUM DAN HAM R.I.
    </textPath>
  </text>

  <!-- Curved Text Bottom: PENGAYOMAN -->
  <path id="textArcBottom" d="M 334 208 A 142 142 0 0 1 66 208" fill="none"/>
  <text fill="#FFE082" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="800" letter-spacing="4.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ PENGAYOMAN ★
    </textPath>
  </text>

  <!-- Center Emblem: Beringin & Timbangan Pengayoman -->
  <!-- Beringin Foliage (Canopy) -->
  <g fill="url(#kmkGold)" stroke="#B37400" stroke-width="1.2">
    <!-- Center top dome -->
    <path d="M 200 100 C 180 100 170 115 170 128 C 160 128 152 138 154 148 C 145 152 140 162 145 172 C 150 180 160 182 170 182 L 230 182 C 240 182 250 180 255 172 C 260 162 255 152 246 148 C 248 138 240 128 230 128 C 230 115 220 100 200 100 Z"/>
    <!-- Foliage internal texture -->
    <circle cx="185" cy="135" r="7" fill="#FFF275" opacity="0.4"/>
    <circle cx="215" cy="135" r="7" fill="#FFF275" opacity="0.4"/>
    <circle cx="200" cy="120" r="9" fill="#FFF275" opacity="0.4"/>
  </g>

  <!-- Tree Trunk -->
  <path d="M 194 175 L 194 250 L 206 250 L 206 175 Z" fill="url(#kmkGold)" stroke="#B37400" stroke-width="1"/>

  <!-- Scales of Justice (Timbangan) -->
  <!-- Horizontal Balance Bar -->
  <rect x="145" y="192" width="110" height="4.5" rx="2" fill="#FFFFFF" stroke="url(#kmkGold)" stroke-width="1.5"/>
  <circle cx="200" cy="194.2" r="5.5" fill="url(#kmkGold)"/>
  <circle cx="200" cy="194.2" r="2.5" fill="#0A1E3F"/>

  <!-- Left Balance Cord and Pan -->
  <line x1="152" y1="195" x2="135" y2="228" stroke="#FFE082" stroke-width="2"/>
  <line x1="152" y1="195" x2="169" y2="228" stroke="#FFE082" stroke-width="2"/>
  <path d="M 130 228 Q 152 246 174 228 Z" fill="url(#kmkGold)" stroke="#B37400" stroke-width="1.5"/>

  <!-- Right Balance Cord and Pan -->
  <line x1="248" y1="195" x2="231" y2="228" stroke="#FFE082" stroke-width="2"/>
  <line x1="248" y1="195" x2="265" y2="228" stroke="#FFE082" stroke-width="2"/>
  <path d="M 226 228 Q 248 246 270 228 Z" fill="url(#kmkGold)" stroke="#B37400" stroke-width="1.5"/>

  <!-- Pedestal Base -->
  <path d="M 175 250 L 225 250 L 235 264 L 165 264 Z" fill="url(#kmkGold)" stroke="#B37400" stroke-width="1.5"/>
  <rect x="155" y="264" width="90" height="6" rx="2" fill="url(#kmkGold)"/>

  <!-- Gold Star in Center Bottom -->
  <polygon points="200,82 203,91 212,91 205,96 207,105 200,100 193,105 195,96 188,91 197,91" fill="#FFE082"/>
</svg>
