<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="krwGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008040"/>
      <stop offset="100%" stop-color="#004D25"/>
    </linearGradient>
    <linearGradient id="krwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="krwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="200" cy="200" r="190" fill="#FFFFFF" stroke="#004D25" stroke-width="7" filter="url(#krwShadow)"/>
  <circle cx="200" cy="200" r="174" fill="none" stroke="url(#krwGold)" stroke-width="3"/>
  <circle cx="200" cy="200" r="144" fill="#F4FAF6" stroke="#A5D6A7" stroke-width="2"/>

  <!-- Curved Text Top: DINAS TENAGA KERJA -->
  <path id="krwArcTop" d="M 52 200 A 148 148 0 0 1 348 200" fill="none"/>
  <text fill="#004D25" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14.5" font-weight="900" letter-spacing="3.2">
    <textPath href="#krwArcTop" startOffset="50%" text-anchor="middle">
      DINAS TENAGA KERJA
    </textPath>
  </text>

  <!-- Curved Text Bottom: KABUPATEN KARAWANG -->
  <path id="krwArcBottom" d="M 342 208 A 148 148 0 0 1 58 208" fill="none"/>
  <text fill="#004D25" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="3.8">
    <textPath href="#krwArcBottom" startOffset="50%" text-anchor="middle">
      ★ KABUPATEN KARAWANG ★
    </textPath>
  </text>

  <!-- Center Shield: Lambang Resmi Daerah Karawang -->
  <!-- Main Shield Contour -->
  <g filter="url(#krwShadow)">
    <path d="M 200 95 C 248 95 258 120 258 160 C 258 215 200 248 200 248 C 200 248 142 215 142 160 C 142 120 152 95 200 95 Z"
          fill="url(#krwGreen)" stroke="url(#krwGold)" stroke-width="4.5"/>
  </g>

  <!-- Golden Star at Shield Apex -->
  <polygon points="200,104 203,113 213,113 205,118 208,127 200,122 192,127 195,118 187,113 197,113" fill="#FFE082"/>

  <!-- Padi & Kapas Border Garland -->
  <!-- Left Padi (Yellow) -->
  <path d="M 160 175 Q 155 135 180 120" stroke="#FFD54F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="162" cy="165" r="2.5" fill="#FFD54F"/>
  <circle cx="158" cy="152" r="2.5" fill="#FFD54F"/>
  <circle cx="162" cy="140" r="2.5" fill="#FFD54F"/>
  <circle cx="170" cy="128" r="2.5" fill="#FFD54F"/>

  <!-- Right Kapas (White/Green) -->
  <path d="M 240 175 Q 245 135 220 120" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="238" cy="165" r="3" fill="#FFFFFF"/>
  <circle cx="242" cy="152" r="3" fill="#FFFFFF"/>
  <circle cx="238" cy="140" r="3" fill="#FFFFFF"/>
  <circle cx="230" cy="128" r="3" fill="#FFFFFF"/>

  <!-- Golok Karawang (Traditional Weapon of Pangkal Perjuangan) -->
  <path d="M 172 188 L 225 138 Q 230 142 225 146 L 178 194 Z" fill="#E0E0E0" stroke="#424242" stroke-width="1"/>
  <!-- Handle (Gagang Golok) -->
  <path d="M 166 195 Q 163 202 172 200 L 178 194 L 172 188 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="1"/>

  <!-- Pintu Air / Bendungan Walahar Karawang (Waterway) -->
  <rect x="175" y="165" width="50" height="22" rx="3" fill="#1565C0" stroke="#FFFFFF" stroke-width="1.2"/>
  <line x1="185" y1="165" x2="185" y2="187" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="195" y1="165" x2="195" y2="187" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="205" y1="165" x2="205" y2="187" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="215" y1="165" x2="215" y2="187" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Gear Wheel (Roda Gigi Industri) in Center -->
  <circle cx="200" cy="198" r="14" fill="#FFA000" stroke="#FF6F00" stroke-width="2"/>
  <circle cx="200" cy="198" r="5" fill="#004D25"/>

  <!-- Ribbon: PANGKAL PERJUANGAN -->
  <g transform="translate(142, 240)">
    <path d="M 0 5 L 15 0 L 101 0 L 116 5 L 112 18 L 101 14 L 15 14 L 4 18 Z" fill="#FFC107" stroke="#E65100" stroke-width="1"/>
    <text x="58" y="10" text-anchor="middle" fill="#004D25" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="900" letter-spacing="0.5">
      PANGKAL PERJUANGAN
    </text>
  </g>

  <!-- Tagline below ribbon -->
  <rect x="135" y="262" width="130" height="18" rx="9" fill="#004D25"/>
  <text x="200" y="274.5" text-anchor="middle" fill="#FFE082" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="800" letter-spacing="1">
    PEMKAB KARAWANG
  </text>
</svg>
